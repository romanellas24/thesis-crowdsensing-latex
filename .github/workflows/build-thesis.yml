name: Build and release thesis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile thesis (full)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: src/main.tex
          work_in_root_file_dir: true
          texlive_version: 2024

      - name: Rename full version
        run: mv src/main.pdf src/daniele-romanella-tesi-full.pdf

      - name: Compile thesis (official)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: src/main-official.tex
          work_in_root_file_dir: true
          texlive_version: 2024

      - name: Rename official version
        run: mv src/main-official.pdf src/daniele-romanella-tesi-official.pdf

      - name: Upload artifact (full)
        uses: actions/upload-artifact@v4
        with:
          name: daniele-romanella-tesi-full
          path: src/daniele-romanella-tesi-full.pdf

      - name: Upload artifact (official)
        uses: actions/upload-artifact@v4
        with:
          name: daniele-romanella-tesi-official
          path: src/daniele-romanella-tesi-official.pdf

      - name: Release thesis
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest build
          files: |
            src/daniele-romanella-tesi-full.pdf
            src/daniele-romanella-tesi-official.pdf